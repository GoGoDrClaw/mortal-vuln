networks:
  vulnnotes:
    driver: bridge
services:
  backend:
    build: ./backend
    container_name: vulnnotes-backend
    environment:
    - PORT=3000
    - JWT_SECRET=${JWT_SECRET:-secret123}
    - TEAM_COUNT=${TEAM_COUNT:-6}
    - RESET_TIME=${RESET_TIME:-}
    - RESET_TIMEZONE=${RESET_TIMEZONE:-UTC}
    - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-20}
    - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-40}
    - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-}
    networks:
    - vulnnotes
    restart: unless-stopped
    volumes:
    - ./data:/data
version: '3.8'
volumes: {}
